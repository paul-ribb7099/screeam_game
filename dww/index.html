<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Based on the "runner" demo by Thomas, link to repository: https://github.com/methio/MITID-p5-template/tree/main/demo-games/runner -->
    <!-- I've decided to take inspiration from the runner demo by Thomas, as it's fairly similar to my project. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCREEAM!</title>


<!--the line below links the css file to the html file, so that the styles are applied to the game.-->
    <link href="style.css" rel="stylesheet" />


    <!-- p5 libraries (kept locally so the game works without wifi) -->
    <script src="libraries/p5.js" type="text/javascript"></script>
    <script src="libraries/p5Sound.js" type="text/javascript"></script>
    <script src="https://unpkg.com/@gohai/p5.webserial@1/libraries/p5.webserial.js"></script>

<!--
  ---------------------------------------------------------------------  
                                GAME FILES
  ---------------------------------------------------------------------  

-->

<!--I decided to seperate my project into multiple files to make things easier to manage and tweak if some errors appear. -->
<!-- It also makes things easier to read and understand, as I can focus on one aspect of the game at a time. -->


<!-- player.js contains everything related to the player: characters,movement, hitbox etc. -->
    <script src="player.js" type="text/javascript"></script>

<!-- enemies.js contains everything related to the enemies: characters, movement, hitbox, -->
    <script src="enemies.js" type="text/javascript"></script>

<!-- mic.js contains everything related to the microphone: the input, the output,and the volume thresholds. -->
    <script src="mic.js" type="text/javascript"></script>

<!--the screen.js file contains everything related to the screen: the background, the score, the game over screen, and the start screen. -->
    <script src="screen.js" type="text/javascript"></script>

    <!-- main file, loaded last because it uses everything above -->
    <script src="script.js" type="text/javascript" defer></script>
</head>
<body>
    <main>
        <!-- p5 canvas is attached here -->
    </main>
</body>
</html>
